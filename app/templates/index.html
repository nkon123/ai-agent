<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent</title>
<style>
  :root { --bd:#d8d8d8; --bg:#fafafa; --me:#e8f0fe; --accent:#2b6cb0; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 system-ui, "Malgun Gothic", sans-serif;
         display:flex; height:100vh; background:var(--bg); color:#222; }

  aside { background:#fff; overflow-y:auto; padding:14px; flex-shrink:0; }
  aside h2 { font-size:12px; margin:0 0 10px; color:#666; letter-spacing:.02em; }
  aside h3 { font-size:11px; color:#999; margin:16px 0 7px; font-weight:600; }

  /* 좌: 대화 목록 */
  #left { width:220px; border-right:1px solid var(--bd); display:flex;
          flex-direction:column; }
  #newchat { width:100%; padding:8px; margin-bottom:12px; border:1px solid var(--bd);
             border-radius:6px; background:#fff; font:inherit; font-size:13px;
             cursor:pointer; }
  #newchat:hover { background:#f0f5ff; border-color:#9db8e0; }
  .chat { padding:8px 10px; border-radius:6px; cursor:pointer; margin-bottom:3px;
          font-size:13px; overflow:hidden; text-overflow:ellipsis;
          white-space:nowrap; }
  .chat:hover { background:#f3f3f3; }
  .chat.on { background:#e8f0fe; font-weight:600; }
  .chat small { display:block; color:#999; font-size:11px; font-weight:400; }

  /* 우: 예시 질문 */
  #right { width:250px; border-left:1px solid var(--bd); }
  .ex { display:block; width:100%; text-align:left; border:1px solid var(--bd);
        border-radius:6px; padding:9px 11px; margin-bottom:7px; background:#fff;
        font:inherit; font-size:13px; color:#222; cursor:pointer; line-height:1.4; }
  .ex:hover { background:#f0f5ff; border-color:#9db8e0; }
  #mcp { font-size:11px; color:#999; margin-top:16px; }

  /* 중앙: 대화 */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow-y:auto; padding:20px; }
  .msg { max-width:70ch; margin:0 0 14px; padding:10px 14px; border-radius:8px;
         white-space:pre-wrap; word-break:break-word; }
  .user { background:var(--me); margin-left:auto; }
  .bot  { background:#fff; border:1px solid var(--bd); }
  .err  { background:#fdecea; border:1px solid #f5c6c2; }
  .warn { background:#fff7e6; border:1px solid #f0d9a8; }
  .calls { font-size:12px; color:#666; margin:-8px 0 14px; }
  .note  { font-size:12px; color:#8a6d3b; background:#fdf7e3; border-radius:6px;
           padding:7px 11px; margin:0 0 14px; max-width:70ch; }

  /* 진행 표시 */
  .work { background:#f4f7fb; border:1px solid #dbe4f0; color:#3a5170;
          max-width:70ch; margin:0 0 14px; padding:9px 13px; border-radius:8px;
          font-size:13px; }
  .work .step { display:block; opacity:.55; }
  .work .step:last-child { opacity:1; font-weight:600; }
  .work .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
               background:#5b83c0; margin-right:7px; animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  form { display:flex; gap:8px; padding:14px; border-top:1px solid var(--bd);
         background:#fff; }
  input { flex:1; padding:10px; border:1px solid var(--bd); border-radius:6px;
          font-size:14px; }
  button#send { padding:10px 18px; border:0; border-radius:6px;
                background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button#send:disabled { background:#aaa; cursor:default; }

  /* 좁은 화면에서는 옆칸을 접는다 */
  @media (max-width:1100px) { #right { display:none; } }
  @media (max-width:820px)  { #left  { display:none; } }
</style>
</head>
<body>

<aside id="left">
  <button id="newchat">+ 새 대화</button>
  <h2>대화 목록</h2>
  <div id="chats"></div>
</aside>

<main>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="메시지를 입력하세요" autocomplete="off" autofocus>
    <button id="send">보내기</button>
  </form>
</main>

<aside id="right">
  <h2>이렇게 물어보세요</h2>
  <div id="examples">불러오는 중…</div>
  <p id="mcp"></p>
</aside>

<script>
// ── 대화 저장 ────────────────────────────────────────────────────────────
// 브라우저에만 남는다. 서버의 대화 기억(체크포인터)은 프로세스 메모리라
// 서버를 다시 띄우면 사라진다 — 그때는 화면에 이전 대화가 보여도 모델은
// 앞 내용을 기억하지 못한다. 그 사실을 대화를 열 때 알려 준다.
const KEY = "ai-agent-chats";
let chats = [];
let currentId = null;
let serverBoot = null;      // 서버 기동 시각. 바뀌면 재시작된 것이다

const load = () => { try { chats = JSON.parse(localStorage.getItem(KEY)) || []; }
                     catch (e) { chats = []; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(chats.slice(0, 50))); }
                     catch (e) {} };
const cur  = () => chats.find(c => c.id === currentId);

const log = document.getElementById("log");

function renderChats() {
  const box = document.getElementById("chats");
  box.innerHTML = "";
  if (!chats.length) { box.innerHTML = '<div class="chat" style="color:#aaa">(없음)</div>'; return; }
  for (const c of chats) {
    const el = document.createElement("div");
    el.className = "chat" + (c.id === currentId ? " on" : "");
    el.textContent = c.title || "새 대화";
    const t = document.createElement("small");
    t.textContent = new Date(c.updated).toLocaleString("ko-KR",
      {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
    el.appendChild(t);
    el.addEventListener("click", () => openChat(c.id));
    box.appendChild(el);
  }
}

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function addCalls(calls) {
  if (!calls || !calls.length) return;
  const c = document.createElement("div");
  c.className = "calls";
  c.textContent = "사용한 툴: " + calls.map(t => t.name).join(", ");
  log.appendChild(c);
}

function openChat(id) {
  currentId = id;
  const c = cur();
  log.innerHTML = "";
  if (c) {
    // 서버가 재시작됐으면 모델은 이 대화를 기억하지 못한다.
    if (serverBoot && c.boot && c.boot !== serverBoot) {
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = "서버가 다시 시작되어 모델은 아래 내용을 기억하지 못합니다. "
                    + "이어서 물으실 때는 필요한 내용을 다시 알려주세요.";
      log.appendChild(n);
    }
    for (const m of c.messages) { add(m.text, m.cls); addCalls(m.calls); }
  }
  renderChats();
  document.getElementById("q").focus();
}

function newChat() {
  currentId = "web-" + Math.random().toString(36).slice(2, 10);
  chats.unshift({id: currentId, title: "", updated: Date.now(),
                 boot: serverBoot, messages: []});
  save(); openChat(currentId);
}

function remember(text, cls, calls) {
  const c = cur();
  if (!c) return;
  c.messages.push({text, cls, calls: calls || null});
  if (!c.title && cls === "user") c.title = text.slice(0, 30);
  c.updated = Date.now();
  c.boot = serverBoot;
  // 최근 대화를 위로 올린다.
  chats = [c, ...chats.filter(x => x.id !== c.id)];
  save(); renderChats();
}

document.getElementById("newchat").addEventListener("click", newChat);

// ── 예시 질문 ────────────────────────────────────────────────────────────
fetch("/api/tools").then(r => r.json()).then(d => {
  const box = document.getElementById("examples");
  box.innerHTML = "";
  serverBoot = (d.mcp && d.mcp.boot) || null;
  if (d.mcp && d.mcp.connected) {
    document.getElementById("mcp").textContent =
      "MCP " + d.mcp.protocol + " · " + d.mcp.transport + " · 툴 " +
      d.tools.filter(t => t.in_chat).length + "개";
  }
  // 챗봇에 노출된 툴의 예시만 띄운다 — 대화에 없는 툴의 예시를 클릭하면
  // 모델이 답할 수 없다.
  const shown = d.tools.filter(t => t.in_chat && t.examples && t.examples.length);
  if (!shown.length) { box.textContent = "(예시 없음)"; return; }
  for (const t of shown) {
    const h = document.createElement("h3");
    h.textContent = t.label;
    box.appendChild(h);
    for (const text of t.examples) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "ex"; b.textContent = text;
      // 바로 보내지 않고 입력창에 넣는다. 날짜나 ID 를 고쳐서 보내는
      // 경우가 대부분이라 그 편이 쓸모 있다.
      b.addEventListener("click", () => {
        const q = document.getElementById("q");
        q.value = text; q.focus();
        q.setSelectionRange(text.length, text.length);
      });
      box.appendChild(b);
    }
  }
}).finally(() => {
  load();
  if (chats.length) openChat(chats[0].id); else newChat();
});

// ── 전송 ────────────────────────────────────────────────────────────────
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("q");
  const btn = document.getElementById("send");
  const text = q.value.trim();
  if (!text) return;
  add(text, "user"); remember(text, "user");
  q.value = ""; btn.disabled = true;

  const work = document.createElement("div");
  work.className = "work";
  work.innerHTML = '<span class="step"><i class="dot"></i>시작하는 중…</span>';
  log.appendChild(work);
  log.scrollTop = log.scrollHeight;

  const step = (t) => {
    const last = work.lastElementChild;
    if (last && last.dataset.raw === t) return;   // 같은 문구는 줄을 늘리지 않는다
    const el = document.createElement("span");
    el.className = "step"; el.dataset.raw = t;
    el.innerHTML = '<i class="dot"></i>';
    el.appendChild(document.createTextNode(t));
    work.appendChild(el);
    log.scrollTop = log.scrollHeight;
  };

  const finish = (cls, body, calls, pending) => {
    work.remove();
    add(body, cls); addCalls(calls); remember(body, cls, calls);
    for (const p of (pending || [])) {
      const t = "확인 필요: " + (p.message || "서버가 사용자 확인을 요청했다");
      add(t, "warn"); remember(t, "warn");
    }
  };

  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, thread_id: currentId}),
    });
    if (!res.ok || !res.body) {
      const d = await res.json().catch(() => ({error: "응답을 읽지 못했다"}));
      finish("err", d.error || "요청 실패");
    } else {
      // SSE 를 직접 읽는다. EventSource 는 POST 를 못 보내서 fetch 로 받는다.
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        const parts = buf.split("\n\n");
        buf = parts.pop();                        // 잘린 마지막 조각은 남긴다
        for (const part of parts) {
          const line = part.split("\n").find(l => l.startsWith("data:"));
          if (!line) continue;
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === "done") finish("bot", ev.reply || "(빈 응답)",
                                         ev.tool_calls, ev.needs_confirmation);
          else if (ev.type === "error") finish("err", ev.text);
          else step(ev.text);
        }
      }
    }
  } catch (err) {
    finish("err", String(err));
  } finally {
    btn.disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
  }
});
</script>
</body>
</html>
