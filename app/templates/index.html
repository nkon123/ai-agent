<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent</title>
<style>
  :root { --bd:#d8d8d8; --bg:#fafafa; --me:#e8f0fe; --sys:#f3f3f3; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 system-ui, "Malgun Gothic", sans-serif;
         display:flex; height:100vh; background:var(--bg); }
  aside { width:260px; border-right:1px solid var(--bd); padding:16px;
          overflow-y:auto; background:#fff; }
  aside h2 { font-size:13px; margin:0 0 12px; color:#666; }
  /* 예시 질문은 버튼이다. 클릭하면 입력창에 들어간다. */
  .ex { display:block; width:100%; text-align:left; border:1px solid var(--bd);
        border-radius:6px; padding:9px 11px; margin-bottom:7px; background:#fff;
        font:inherit; font-size:13px; color:#222; cursor:pointer; line-height:1.4; }
  .ex:hover { background:#f0f5ff; border-color:#9db8e0; }
  aside h3 { font-size:11px; color:#999; margin:16px 0 7px; font-weight:600;
             letter-spacing:.02em; }
  #mcp { font-size:11px; color:#999; margin-top:16px; }
  .warn { background:#fff7e6; border:1px solid #f0d9a8; }
  main { flex:1; display:flex; flex-direction:column; }
  #log { flex:1; overflow-y:auto; padding:20px; }
  .msg { max-width:70ch; margin:0 0 14px; padding:10px 14px; border-radius:8px;
         white-space:pre-wrap; word-break:break-word; }
  .user { background:var(--me); margin-left:auto; }
  .bot  { background:#fff; border:1px solid var(--bd); }
  .err  { background:#fdecea; border:1px solid #f5c6c2; }
  .calls { font-size:12px; color:#666; margin:-8px 0 14px; }
  /* 진행 표시. 로컬 모델은 답까지 수십 초~몇 분이라 무엇을 하는 중인지
     계속 보여 줘야 멈춘 것과 구분된다. */
  .work { background:#f4f7fb; border:1px solid #dbe4f0; color:#3a5170;
          max-width:70ch; margin:0 0 14px; padding:9px 13px; border-radius:8px;
          font-size:13px; }
  .work .step { display:block; opacity:.55; }
  .work .step:last-child { opacity:1; font-weight:600; }
  .work .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
               background:#5b83c0; margin-right:7px; animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  form { display:flex; gap:8px; padding:14px; border-top:1px solid var(--bd);
         background:#fff; }
  input { flex:1; padding:10px; border:1px solid var(--bd); border-radius:6px;
          font-size:14px; }
  button { padding:10px 18px; border:0; border-radius:6px; background:#2b6cb0;
           color:#fff; font-size:14px; cursor:pointer; }
  button:disabled { background:#aaa; cursor:default; }
</style>
</head>
<body>
<aside>
  <h2>이렇게 물어보세요</h2>
  <div id="examples">불러오는 중…</div>
  <p id="mcp"></p>
</aside>
<main>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="메시지를 입력하세요" autocomplete="off" autofocus>
    <button id="send">보내기</button>
  </form>
</main>
<script>
// thread_id 는 탭마다 하나. 서버의 체크포인터가 이 값으로 대화를 구분한다.
const threadId = "web-" + Math.random().toString(36).slice(2, 10);
const log = document.getElementById("log");

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

fetch("/api/tools").then(r => r.json()).then(d => {
  const box = document.getElementById("examples");
  box.innerHTML = "";
  // MCP 로 어느 리비전에 붙었는지 화면 아래에 남긴다. 버전이 어긋나면
  // 답이 이상한 것부터가 아니라 여기서 먼저 눈에 띈다.
  if (d.mcp && d.mcp.connected) {
    document.getElementById("mcp").textContent =
      "MCP " + d.mcp.protocol + " · " + d.mcp.transport + " · 툴 " +
      d.tools.filter(t => t.in_chat).length + "개";
  }

  // 예시는 각 툴이 들고 온다(_meta.examples). 챗봇에 노출된 툴의 예시만
  // 띄운다 — 대화에 없는 툴의 예시를 클릭하면 모델이 답할 수 없다.
  const shown = d.tools.filter(t => t.in_chat && t.examples && t.examples.length);
  if (!shown.length) { box.textContent = "(예시 없음)"; return; }

  for (const t of shown) {
    const h = document.createElement("h3");
    h.textContent = t.label;
    box.appendChild(h);
    for (const text of t.examples) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "ex";
      b.textContent = text;
      // 바로 보내지 않고 입력창에 넣는다. 날짜나 ID 를 고쳐서 보내는
      // 경우가 대부분이라 그 편이 쓸모 있다.
      b.addEventListener("click", () => {
        const q = document.getElementById("q");
        q.value = text;
        q.focus();
        q.setSelectionRange(text.length, text.length);
      });
      box.appendChild(b);
    }
  }
});

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("q");
  const btn = document.getElementById("send");
  const text = q.value.trim();
  if (!text) return;
  add(text, "user");
  q.value = ""; btn.disabled = true;

  // 진행 표시 상자. 단계가 올 때마다 줄을 쌓고 마지막 줄을 강조한다.
  const work = document.createElement("div");
  work.className = "work";
  work.innerHTML = '<span class="step"><i class="dot"></i>시작하는 중…</span>';
  log.appendChild(work);
  log.scrollTop = log.scrollHeight;

  const step = (t) => {
    // 같은 문구가 연달아 오면 줄을 늘리지 않는다(진행률만 갱신되는 경우).
    const last = work.lastElementChild;
    if (last && last.dataset.raw === t) return;
    const el = document.createElement("span");
    el.className = "step";
    el.dataset.raw = t;
    el.innerHTML = '<i class="dot"></i>';
    el.appendChild(document.createTextNode(t));
    work.appendChild(el);
    log.scrollTop = log.scrollHeight;
  };

  const finish = (cls, body, calls, pending) => {
    work.remove();
    const d = add(body, cls);
    if (calls && calls.length) {
      const c = document.createElement("div");
      c.className = "calls";
      c.textContent = "사용한 툴: " + calls.map(t => t.name).join(", ");
      log.appendChild(c);
    }
    for (const p of (pending || [])) {
      add("확인 필요: " + (p.message || "서버가 사용자 확인을 요청했다"), "msg warn");
    }
    return d;
  };

  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, thread_id: threadId}),
    });
    if (!res.ok || !res.body) {
      const d = await res.json().catch(() => ({error: "응답을 읽지 못했다"}));
      finish("err", d.error || "요청 실패");
    } else {
      // SSE 를 직접 읽는다. EventSource 는 POST 를 못 보내서 fetch 로 받는다.
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        const parts = buf.split("\n\n");
        buf = parts.pop();                       // 잘린 마지막 조각은 남긴다
        for (const part of parts) {
          const line = part.split("\n").find(l => l.startsWith("data:"));
          if (!line) continue;
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === "done") {
            finish("bot", ev.reply || "(빈 응답)", ev.tool_calls, ev.needs_confirmation);
          } else if (ev.type === "error") {
            finish("err", ev.text);
          } else {
            step(ev.text);
          }
        }
      }
    }
  } catch (err) {
    finish("err", String(err));
  } finally {
    btn.disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
  }
});
</script>
</body>
</html>
