<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent</title>
<style>
  :root { --bd:#d8d8d8; --bg:#fafafa; --me:#e8f0fe; --sys:#f3f3f3; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 system-ui, "Malgun Gothic", sans-serif;
         display:flex; height:100vh; background:var(--bg); }
  aside { width:260px; border-right:1px solid var(--bd); padding:16px;
          overflow-y:auto; background:#fff; }
  aside h2 { font-size:13px; margin:0 0 12px; color:#666; }
  .tool { border:1px solid var(--bd); border-radius:6px; padding:8px 10px;
          margin-bottom:8px; }
  .tool b { display:block; font-size:13px; }
  .tool span { color:#777; font-size:12px; }
  .tool em { font-style:normal; font-size:11px; color:#b45309; }
  .tool.step { opacity:.65; }
  .tool i { font-style:normal; font-size:11px; color:#666; }
  aside h3 { font-size:12px; color:#888; margin:18px 0 8px; font-weight:600; }
  #mcp { font-size:11px; color:#999; margin-top:16px; }
  .warn { background:#fff7e6; border:1px solid #f0d9a8; }
  main { flex:1; display:flex; flex-direction:column; }
  #log { flex:1; overflow-y:auto; padding:20px; }
  .msg { max-width:70ch; margin:0 0 14px; padding:10px 14px; border-radius:8px;
         white-space:pre-wrap; word-break:break-word; }
  .user { background:var(--me); margin-left:auto; }
  .bot  { background:#fff; border:1px solid var(--bd); }
  .err  { background:#fdecea; border:1px solid #f5c6c2; }
  .calls { font-size:12px; color:#666; margin:-8px 0 14px; }
  form { display:flex; gap:8px; padding:14px; border-top:1px solid var(--bd);
         background:#fff; }
  input { flex:1; padding:10px; border:1px solid var(--bd); border-radius:6px;
          font-size:14px; }
  button { padding:10px 18px; border:0; border-radius:6px; background:#2b6cb0;
           color:#fff; font-size:14px; cursor:pointer; }
  button:disabled { background:#aaa; cursor:default; }
</style>
</head>
<body>
<aside>
  <h2>등록된 툴</h2>
  <div id="tools">불러오는 중…</div>
  <p id="mcp"></p>
</aside>
<main>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="메시지를 입력하세요" autocomplete="off" autofocus>
    <button id="send">보내기</button>
  </form>
</main>
<script>
// thread_id 는 탭마다 하나. 서버의 체크포인터가 이 값으로 대화를 구분한다.
const threadId = "web-" + Math.random().toString(36).slice(2, 10);
const log = document.getElementById("log");

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

fetch("/api/tools").then(r => r.json()).then(d => {
  const box = document.getElementById("tools");
  box.innerHTML = "";
  // MCP 로 어느 리비전에 붙었는지 화면에 남긴다. 버전이 어긋나면
  // 툴이 안 보이는 것부터가 아니라 여기서 먼저 눈에 띈다.
  if (d.mcp && d.mcp.connected) {
    document.getElementById("mcp").textContent =
      "MCP " + d.mcp.protocol + " · " + d.mcp.transport + " · " + d.mcp.server;
  }
  if (!d.tools.length) { box.textContent = "(없음)"; return; }
  // 챗봇에 노출된 툴과 그렇지 않은 툴을 나눠 보여 준다. 목록에 있는데
  // 모델이 안 부르는 이유를 화면에서 바로 알 수 있어야 한다.
  const render = (t) => {
    const el = document.createElement("div");
    el.className = "tool" + (t.in_chat ? "" : " step");
    el.innerHTML = "<b></b><span></span><em></em><i></i>";
    el.querySelector("b").textContent = t.label;
    el.querySelector("span").textContent = t.description || t.name;
    if (t.destructive) el.querySelector("em").textContent = "⚠ 확인 필요 동작";
    if (!t.in_chat) el.querySelector("i").textContent = "단계별 — 대화에는 미노출";
    box.appendChild(el);
  };
  d.tools.filter(t => t.in_chat).forEach(render);
  const steps = d.tools.filter(t => !t.in_chat);
  if (steps.length) {
    const h = document.createElement("h3");
    h.textContent = "단계별 툴 (MCP 호스트용)";
    box.appendChild(h);
    steps.forEach(render);
  }
});

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("q");
  const btn = document.getElementById("send");
  const text = q.value.trim();
  if (!text) return;
  add(text, "user");
  q.value = ""; btn.disabled = true;
  const pending = add("…", "bot");
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, thread_id: threadId}),
    });
    const d = await res.json();
    if (d.error) { pending.className = "msg err"; pending.textContent = d.error; }
    else {
      pending.textContent = d.reply || "(빈 응답)";
      // 이번 턴에 실제로 부른 툴만 서버가 내려준다.
      if (d.tool_calls && d.tool_calls.length) {
        const c = document.createElement("div");
        c.className = "calls";
        c.textContent = "사용한 툴: " + d.tool_calls.map(t => t.name).join(", ");
        log.appendChild(c);
      }
      // MCP 서버가 사람 확인을 요구해 클라이언트가 거절한 건.
      // 자동 승인하지 않으므로 사용자에게 그대로 보여 준다.
      if (d.needs_confirmation && d.needs_confirmation.length) {
        for (const p of d.needs_confirmation) {
          add("확인 필요: " + (p.message || "서버가 사용자 확인을 요청했다"), "msg warn");
        }
      }
    }
  } catch (err) {
    pending.className = "msg err";
    pending.textContent = String(err);
  } finally {
    btn.disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
  }
});
</script>
</body>
</html>
