<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent</title>
<style>
  /* 사내망(폐쇄망)에서 뜬다 — 외부 폰트·CDN 을 쓰지 않는다. 글꼴은 PC 에 있는 것만. */
  :root {
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --ink:#1b2130; --ink-2:#3d4558;
    --muted:#737b8c; --faint:#a3a9b6; --line:#e5e7ec; --line-2:#eef0f3;
    --accent:#4058d6; --accent-ink:#ffffff; --accent-weak:#eef1fd; --accent-line:#cdd5f6;
    --user:#4058d6; --user-ink:#ffffff;
    --ok:#1f9d63; --bad:#d64545; --warn-bg:#fff7e8; --warn-line:#f1d9a6; --warn-ink:#7a5a14;
    --err-bg:#fdeeee; --err-line:#f4c9c9; --err-ink:#9b2c2c;
    --code-bg:#f3f4f7; --shadow:0 1px 2px rgba(20,28,45,.06), 0 4px 16px rgba(20,28,45,.06);
    --radius:12px;
    --glow-1:rgba(91,111,240,.13); --glow-2:rgba(168,85,247,.10); --glow-3:rgba(56,189,248,.11);
    --sheen:rgba(91,111,240,.07);
    --font: "Pretendard", "Pretendard Variable", "Malgun Gothic", "Apple SD Gothic Neo",
            system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "D2Coding", "Cascadia Code", Consolas, ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#14171e; --panel:#1b1f28; --panel-2:#1f2430; --ink:#e7e9ee; --ink-2:#c3c8d3;
      --muted:#949bab; --faint:#6b7282; --line:#2b313d; --line-2:#252a35;
      --accent:#7b8ff0; --accent-ink:#10131a; --accent-weak:#262c45; --accent-line:#3a4470;
      --user:#5068e0; --user-ink:#ffffff;
      --warn-bg:#2d2615; --warn-line:#5a4a22; --warn-ink:#e9cf8f;
      --err-bg:#2f1a1c; --err-line:#5c2a2e; --err-ink:#f0aeb0;
      --code-bg:#232835; --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      --glow-1:rgba(110,130,255,.16); --glow-2:rgba(180,100,255,.12); --glow-3:rgba(56,189,248,.10);
      --sheen:rgba(150,165,255,.07);
    }
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14.5px/1.65 var(--font); color:var(--ink); background:var(--bg);
         display:flex; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; }
  svg { flex-shrink:0; }

  /* ── 좌: 대화 목록 ───────────────────────────────────────────────── */
  #left { width:264px; background:var(--panel); border-right:1px solid var(--line);
          display:flex; flex-direction:column; flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:10px; padding:18px 18px 14px; }
  .logo { width:32px; height:32px; border-radius:9px; display:grid; place-items:center;
          background:linear-gradient(135deg, #5b6ff0, #3a4fc8); color:#fff; }
  .brand b { font-size:15.5px; letter-spacing:-.01em; display:block; line-height:1.2; }
  .brand small { color:var(--muted); font-size:11.5px; }
  #newchat { margin:0 14px 12px; padding:9px 12px; border:1px solid var(--line);
             border-radius:10px; background:var(--panel); cursor:pointer;
             display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600;
             transition:background .15s, border-color .15s; }
  #newchat:hover { background:var(--accent-weak); border-color:var(--accent-line); color:var(--accent); }
  .side-label { font-size:11.5px; font-weight:600; color:var(--faint); letter-spacing:.04em;
                padding:6px 18px 6px; }
  #chats { flex:1; overflow-y:auto; padding:0 10px 14px; }
  .chat { position:relative; padding:8px 30px 8px 10px; border-radius:8px; cursor:pointer;
          margin-bottom:2px; font-size:13.5px; color:var(--ink-2); }
  .chat .t { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat small { display:block; color:var(--faint); font-size:11px; }
  .chat:hover { background:var(--line-2); }
  .chat.on { background:var(--accent-weak); color:var(--ink); font-weight:600; }
  .chat .del { position:absolute; right:6px; top:50%; transform:translateY(-50%);
               width:22px; height:22px; border:0; border-radius:6px; background:transparent;
               color:var(--faint); cursor:pointer; display:none; place-items:center; }
  .chat:hover .del, .chat.on .del { display:grid; }
  .chat .del:hover { background:var(--line); color:var(--bad); }
  .empty-list { color:var(--faint); font-size:12.5px; padding:6px 10px; }

  /* ── 중앙 ─────────────────────────────────────────────────────── */
  main { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; isolation:isolate; }

  /* 답을 기다리는 동안(main.thinking) 대화 영역 뒤에 은은한 빛이 돌며 색이 바뀐다.
     애니메이션은 늘 돌리되 멈춰 두고 투명하게 숨긴다 — 끝날 때 색이 튀지 않고 서서히 사라지게. */
  main::before { content:""; position:absolute; inset:56px 0 0; z-index:-1; pointer-events:none;
                 background:
                   radial-gradient(40% 50% at 18% 30%, var(--glow-1), transparent 70%),
                   radial-gradient(45% 55% at 82% 65%, var(--glow-2), transparent 70%),
                   radial-gradient(50% 45% at 50% 105%, var(--glow-3), transparent 70%);
                 background-size:160% 160%;
                 opacity:0; transition:opacity 1.2s ease;
                 animation:aurora 14s ease-in-out infinite alternate; animation-play-state:paused; }
  main.thinking::before { opacity:1; animation-play-state:running; }
  @keyframes aurora {
    0%   { background-position:0% 0%;     filter:hue-rotate(0deg); }
    50%  { background-position:100% 40%;  filter:hue-rotate(40deg); }
    100% { background-position:30% 100%;  filter:hue-rotate(-30deg); }
  }
  main.thinking form { animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { border-color:var(--line);        box-shadow:var(--shadow); }
    50%      { border-color:var(--accent-line); box-shadow:var(--shadow), 0 0 0 4px var(--accent-weak); }
  }
  @media (prefers-reduced-motion: reduce) {
    main::before, main.thinking form, .work::after { animation:none; }
  }
  .top { height:56px; display:flex; align-items:center; gap:10px; padding:0 22px;
         border-bottom:1px solid var(--line); background:var(--panel); flex-shrink:0; }
  #menu { display:none; border:0; background:transparent; cursor:pointer; padding:6px;
          border-radius:8px; color:var(--muted); }
  #title { font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis;
           white-space:nowrap; flex:1; min-width:0; }
  .status { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted);
            padding:4px 10px; border:1px solid var(--line); border-radius:999px;
            background:var(--panel-2); white-space:nowrap; }
  .status i { width:7px; height:7px; border-radius:50%; background:var(--faint); }
  .status.ok i { background:var(--ok); box-shadow:0 0 0 3px rgba(31,157,99,.15); }
  .status.bad i { background:var(--bad); box-shadow:0 0 0 3px rgba(214,69,69,.15); }

  #log { flex:1; overflow-y:auto; scroll-behavior:smooth; }
  .thread { max-width:820px; margin:0 auto; padding:28px 24px 12px; }

  /* 첫 화면 */
  .welcome { max-width:820px; margin:0 auto; padding:9vh 24px 24px; text-align:center; }
  .welcome .logo { width:52px; height:52px; border-radius:14px; margin:0 auto 18px; }
  .welcome h1 { font-size:24px; margin:0 0 8px; letter-spacing:-.02em; }
  .welcome p { color:var(--muted); margin:0 0 30px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:12px;
           text-align:left; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
          padding:14px 14px 10px; box-shadow:var(--shadow); }
  .card h3 { margin:0 0 8px; font-size:13px; color:var(--accent); display:flex; gap:7px;
             align-items:center; }
  .card button { display:block; width:100%; text-align:left; border:0; background:transparent;
                 padding:7px 8px; margin:0 -8px; width:calc(100% + 16px); border-radius:8px;
                 cursor:pointer; color:var(--ink-2); font-size:13.5px; line-height:1.45; }
  .card button:hover { background:var(--accent-weak); color:var(--ink); }

  /* 메시지 */
  .row { display:flex; gap:12px; margin:0 0 22px; animation:rise .22s ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .row.user { justify-content:flex-end; }
  .avatar { width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
            flex-shrink:0; margin-top:2px; background:linear-gradient(135deg, #5b6ff0, #3a4fc8);
            color:#fff; }
  .body { min-width:0; flex:1; }
  .row.user .body { flex:0 1 auto; max-width:78%; }
  /* 한글은 어절 단위로 줄을 바꾸고, 긴 ID·경로만 어쩔 수 없을 때 끊는다 */
  .bubble { white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; }
  .row.user .bubble { background:var(--user); color:var(--user-ink); padding:10px 15px;
                      border-radius:16px 16px 4px 16px; }
  .row.bot .bubble { white-space:normal; }
  .row.err .bubble, .row.warn .bubble { padding:10px 14px; border-radius:10px; }
  .row.err .bubble { background:var(--err-bg); border:1px solid var(--err-line); color:var(--err-ink); }
  .row.warn .bubble { background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn-ink); }
  .avatar.err { background:var(--bad); } .avatar.warn { background:#d39b2a; }

  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 9px;
          border-radius:999px; background:var(--accent-weak); color:var(--accent);
          border:1px solid var(--accent-line); }
  .icon-btn { border:0; background:transparent; color:var(--faint); cursor:pointer;
              padding:4px 6px; border-radius:6px; display:inline-flex; align-items:center;
              gap:4px; font-size:12px; }
  .icon-btn:hover { background:var(--line-2); color:var(--ink-2); }

  .note { font-size:13px; color:var(--warn-ink); background:var(--warn-bg);
          border:1px solid var(--warn-line); border-radius:10px; padding:9px 13px;
          margin:0 0 22px; display:flex; gap:8px; align-items:flex-start; }

  /* 답변 Markdown — 모델 답에는 표·목록·코드가 자주 나온다 */
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p { margin:0 0 .75em; }
  .md h1, .md h2, .md h3, .md h4 { margin:1.1em 0 .45em; line-height:1.35; letter-spacing:-.01em; }
  .md h1 { font-size:1.3em; } .md h2 { font-size:1.18em; } .md h3 { font-size:1.06em; } .md h4 { font-size:1em; }
  .md ul, .md ol { margin:0 0 .8em; padding-left:1.4em; } .md li { margin:.2em 0; }
  .md li::marker { color:var(--faint); }
  .md code { font-family:var(--mono); font-size:.88em; background:var(--code-bg);
             padding:.12em .4em; border-radius:5px; }
  .md pre { background:var(--code-bg); border:1px solid var(--line); border-radius:10px;
            padding:12px 14px; overflow-x:auto; margin:0 0 .9em; line-height:1.5; }
  .md pre code { background:none; padding:0; font-size:12.8px; }
  .md blockquote { margin:0 0 .8em; padding:2px 14px; border-left:3px solid var(--accent-line);
                   color:var(--ink-2); }
  .md hr { border:0; border-top:1px solid var(--line); margin:1.1em 0; }
  .md .tbl { overflow-x:auto; margin:0 0 .9em; border:1px solid var(--line); border-radius:10px; }
  .md table { border-collapse:collapse; width:100%; font-size:13.5px; }
  .md th, .md td { padding:7px 11px; border-bottom:1px solid var(--line-2); text-align:left;
                   vertical-align:top; word-break:keep-all; overflow-wrap:normal; }
  .md th { background:var(--panel-2); font-weight:600; color:var(--ink-2); white-space:nowrap; }
  .md tr:last-child td { border-bottom:0; }

  /* 진행 표시 */
  .work { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
          padding:12px 15px; box-shadow:var(--shadow); font-size:13.5px; }
  .work-head { display:flex; align-items:center; gap:9px; font-weight:600; }
  .work-head .el { margin-left:auto; font-weight:400; color:var(--faint);
                   font-family:var(--mono); font-size:12px; }
  .spin { width:15px; height:15px; border:2px solid var(--accent-line); border-top-color:var(--accent);
          border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* 처리 중 지나가는 빛 — 상자가 멈춰 있지 않다는 것을 보인다 */
  .work { position:relative; overflow:hidden; }
  .work::after { content:""; position:absolute; inset:0; pointer-events:none;
                 background:linear-gradient(100deg, transparent 30%, var(--sheen) 50%, transparent 70%);
                 transform:translateX(-100%); animation:sheen 2.6s ease-in-out infinite; }
  @keyframes sheen { to { transform:translateX(100%); } }
  .work .prev { margin:6px 0 0 24px; padding:0; list-style:none; color:var(--muted); font-size:12.5px; }
  .work .prev li { position:relative; padding-left:14px; }
  .work .prev li::before { content:""; position:absolute; left:0; top:.62em; width:6px; height:6px;
                           border-radius:50%; background:var(--ok); opacity:.7; }

  /* 끝난 뒤 접어 두는 과정. 결과가 먼저 보이고 근거는 펼쳐서 본다. */
  .trace { margin-top:8px; font-size:12.5px; }
  .trace > summary { cursor:pointer; color:var(--muted); list-style:none; user-select:none;
                     display:inline-flex; align-items:center; gap:5px; padding:3px 6px;
                     margin-left:-6px; border-radius:6px; }
  .trace > summary::-webkit-details-marker { display:none; }
  .trace > summary:hover { background:var(--line-2); color:var(--ink-2); }
  .trace > summary svg { transition:transform .15s; }
  .trace[open] > summary svg { transform:rotate(90deg); }
  .tl { margin:8px 0 0 4px; padding:2px 0 2px 16px; border-left:2px solid var(--line); }
  .tstep { position:relative; padding:3px 0; color:var(--ink-2); white-space:pre-wrap; }
  .tstep::before { content:""; position:absolute; left:-21px; top:.75em; width:8px; height:8px;
                   border-radius:50%; background:var(--panel); border:2px solid var(--accent-line); }
  .tstep b { display:inline-block; min-width:44px; color:var(--faint); font-weight:400;
             font-family:var(--mono); font-size:11.5px; }

  /* 입력 */
  .composer-wrap { padding:10px 24px 18px; flex-shrink:0; }
  form { max-width:820px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
         background:var(--panel); border:1px solid var(--line); border-radius:16px;
         padding:8px 8px 8px 16px; box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s; }
  form:focus-within { border-color:var(--accent-line); box-shadow:var(--shadow), 0 0 0 3px var(--accent-weak); }
  textarea { flex:1; border:0; outline:0; resize:none; background:transparent; color:var(--ink);
             font:inherit; line-height:1.55; padding:6px 0; max-height:200px; min-height:24px; }
  textarea::placeholder { color:var(--faint); }
  #send { width:38px; height:38px; border:0; border-radius:11px; background:var(--accent);
          color:var(--accent-ink); cursor:pointer; display:grid; place-items:center;
          transition:opacity .15s, transform .1s; }
  #send:hover { transform:translateY(-1px); }
  #send:disabled { opacity:.35; cursor:default; transform:none; }
  .hint { max-width:820px; margin:7px auto 0; text-align:center; font-size:11.5px; color:var(--faint); }

  /* ── 우: 예시 질문 ───────────────────────────────────────────────── */
  #right { width:288px; background:var(--panel); border-left:1px solid var(--line);
           overflow-y:auto; padding:18px 16px; flex-shrink:0; }
  #right h2 { font-size:13px; margin:0 0 4px; }
  #right .sub { color:var(--muted); font-size:12px; margin:0 0 14px; }
  .group { margin-bottom:16px; }
  .group h3 { font-size:11.5px; color:var(--faint); margin:0 0 6px; font-weight:600;
              letter-spacing:.03em; }
  .ex { display:block; width:100%; text-align:left; border:1px solid var(--line);
        border-radius:10px; padding:8px 11px; margin-bottom:6px; background:var(--panel);
        font-size:13px; color:var(--ink-2); cursor:pointer; line-height:1.45;
        transition:background .15s, border-color .15s; }
  .ex:hover { background:var(--accent-weak); border-color:var(--accent-line); color:var(--ink); }
  #mcp { font-size:11.5px; color:var(--faint); margin:18px 0 0; padding-top:12px;
         border-top:1px solid var(--line-2); font-family:var(--mono); }

  /* 좁은 화면에서는 옆칸을 접는다. 왼쪽은 메뉴 버튼으로 연다. */
  #scrim { display:none; }
  @media (max-width:1180px) { #right { display:none; } }
  @media (max-width:820px) {
    #menu { display:block; }
    #left { position:fixed; inset:0 auto 0 0; z-index:20; transform:translateX(-100%);
            transition:transform .2s; box-shadow:var(--shadow); }
    body.nav #left { transform:none; }
    body.nav #scrim { display:block; position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.25); }
    .thread, .welcome { padding-left:16px; padding-right:16px; }
    .composer-wrap { padding:8px 12px 12px; }
    .row.user .body { max-width:88%; }
    .status span { display:none; }
  }
</style>
</head>
<body>

<aside id="left">
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></div>
    <div><b>AI Agent</b><small>업무 조사 도우미</small></div>
  </div>
  <button id="newchat" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    새 대화
  </button>
  <div class="side-label">대화 목록</div>
  <div id="chats"></div>
</aside>
<div id="scrim"></div>

<main>
  <header class="top">
    <button id="menu" type="button" aria-label="대화 목록 열기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div id="title">새 대화</div>
    <div id="status" class="status"><i></i><span>연결 확인 중…</span></div>
  </header>
  <div id="log"></div>
  <div class="composer-wrap">
    <form id="f">
      <textarea id="q" rows="1" placeholder="무엇을 조사할까요? 예: 오늘 인터페이스 오류 확인해줘" autocomplete="off" autofocus></textarea>
      <button id="send" type="submit" aria-label="보내기" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="hint">Enter 보내기 · Shift+Enter 줄바꿈 · 로컬 모델이라 답변에 수십 초 걸릴 수 있습니다</div>
  </div>
</main>

<aside id="right">
  <h2>이렇게 물어보세요</h2>
  <p class="sub">누르면 입력창에 들어갑니다. 날짜나 ID 를 고쳐서 보내세요.</p>
  <div id="examples">불러오는 중…</div>
  <p id="mcp"></p>
</aside>

<script>
// ── 공통 ────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const ICON = {
  bot: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/></svg>',
  err: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>',
  tool: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
  copy: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  chev: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  x: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  info: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
};

// ── Markdown (답변 전용) ─────────────────────────────────────────────────
// 외부 라이브러리를 못 쓴다(폐쇄망). 모델 답에 실제로 나오는 것만 처리한다:
// 제목·목록·표·코드·인용·굵게. 먼저 전부 HTML 이스케이프한 뒤 표식만 태그로
// 바꾸므로, 답변이나 툴 결과에 섞인 HTML 은 글자로 보일 뿐 실행되지 않는다.
// 기울임(*a*)은 처리하지 않는다 — SQL 의 `SELECT * FROM a*b` 를 깨뜨린다.
const esc = (s) => s.replace(/[&<>"']/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function inline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = esc(s).replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>")
            .replace(/__([^_\n]+?)__/g, "<strong>$1</strong>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
}

const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

function markdown(src) {
  const lines = String(src).replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^\s*```\s*([\w+-]*)/))) {           // 코드 블록
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
    } else if (isRow(line) && i + 1 < lines.length && isSep(lines[i + 1])) {   // 표
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && isRow(lines[i])) rows.push(cells(lines[i++]));
      out.push('<div class="tbl"><table><thead><tr>'
        + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>"
        + rows.map((r) => "<tr>" + head.map((_, k) => `<td>${inline(r[k] || "")}</td>`).join("") + "</tr>").join("")
        + "</tbody></table></div>");
    } else if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {        // 제목
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
      i++;
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {      // 구분선
      out.push("<hr>"); i++;
    } else if (/^\s*>/.test(line)) {                          // 인용
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${markdown(buf.join("\n"))}</blockquote>`);
    } else if (/^\s*([-*•]|\d+[.)])\s+/.test(line)) {          // 목록
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) {
        const depth = lines[i].match(/^\s*/)[0].length;
        const text = lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/, "");
        items.push(`<li${depth >= 2 ? ' style="margin-left:1.1em"' : ""}>${inline(text)}</li>`);
        i++;
        // 들여쓴 이어지는 줄은 같은 항목으로 붙인다
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) {
          items[items.length - 1] = items[items.length - 1].replace(/<\/li>$/, "<br>" + inline(lines[i].trim()) + "</li>");
          i++;
        }
      }
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
    } else if (!line.trim()) {
      i++;
    } else {                                                  // 문단
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,4}\s|>|([-*•]|\d+[.)])\s+)/.test(lines[i])
             && !(isRow(lines[i]) && i + 1 < lines.length && isSep(lines[i + 1]))) buf.push(lines[i++]);
      out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
    }
  }
  return out.join("");
}

// ── 대화 저장 ────────────────────────────────────────────────────────────
// 브라우저에만 남는다. 서버의 대화 기억(체크포인터)은 프로세스 메모리라
// 서버를 다시 띄우면 사라진다 — 그때는 화면에 이전 대화가 보여도 모델은
// 앞 내용을 기억하지 못한다. 그 사실을 대화를 열 때 알려 준다.
// 저장 형식은 예전 화면과 같다 — 쌓여 있던 대화를 그대로 연다.
const KEY = "ai-agent-chats";
let chats = [];
let currentId = null;
let serverBoot = null;      // 서버 기동 시각. 바뀌면 재시작된 것이다
let toolLabels = {};        // 툴 이름 → 화면 이름
let examples = [];          // [{label, examples}]
let busy = false;

const load = () => { try { chats = JSON.parse(localStorage.getItem(KEY)) || []; }
                     catch (e) { chats = []; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(chats.slice(0, 50))); }
                     catch (e) {} };
const cur  = () => chats.find(c => c.id === currentId);

const log = $("log");
let thread = null;          // 메시지가 들어가는 가운데 칸

const scrollDown = () => { log.scrollTop = log.scrollHeight; };

function renderChats() {
  const box = $("chats");
  box.innerHTML = "";
  const listed = chats.filter(c => c.messages && c.messages.length);
  if (!listed.length) { box.appendChild(el("div", "empty-list", "아직 대화가 없습니다")); }
  for (const c of listed) {
    const item = el("div", "chat" + (c.id === currentId ? " on" : ""));
    item.appendChild(el("span", "t", c.title || "새 대화"));
    item.appendChild(el("small", null, new Date(c.updated).toLocaleString("ko-KR",
      {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"})));
    const del = el("button", "del");
    del.type = "button"; del.title = "대화 삭제"; del.innerHTML = ICON.x;
    del.addEventListener("click", (e) => { e.stopPropagation(); removeChat(c.id); });
    item.appendChild(del);
    item.addEventListener("click", () => { openChat(c.id); document.body.classList.remove("nav"); });
    box.appendChild(item);
  }
  const c = cur();
  $("title").textContent = (c && c.title) || "새 대화";
}

function removeChat(id) {
  if (busy && id === currentId) return;
  const c = chats.find(x => x.id === id);
  if (!confirm(`'${(c && c.title) || "새 대화"}' 대화를 삭제할까요?\n이 브라우저에서만 지워집니다.`)) return;
  chats = chats.filter(x => x.id !== id);
  save();
  if (id === currentId) {
    const next = chats.find(x => x.messages && x.messages.length);
    next ? openChat(next.id) : newChat();
  } else renderChats();
}

// ── 화면 그리기 ──────────────────────────────────────────────────────────
function showWelcome() {
  log.innerHTML = "";
  thread = null;
  const w = el("div", "welcome");
  w.innerHTML = `<div class="logo">${ICON.bot.replace(/16/g, "26")}</div>`;
  w.appendChild(el("h1", null, "무엇을 조사할까요?"));
  w.appendChild(el("p", null, "인터페이스 오류 메일, 테이블 영향도, SQL 튜닝까지 — 사내 소스와 DB 를 근거로 답합니다."));
  const grid = el("div", "cards");
  for (const g of examples) {
    const card = el("div", "card");
    const h = el("h3");
    h.innerHTML = ICON.tool;
    h.appendChild(document.createTextNode(g.label));
    card.appendChild(h);
    for (const text of g.examples.slice(0, 3)) {
      const b = el("button", null, text);
      b.type = "button";
      b.addEventListener("click", () => fillInput(text));
      card.appendChild(b);
    }
    grid.appendChild(card);
  }
  if (examples.length) w.appendChild(grid);
  log.appendChild(w);
}

function ensureThread() {
  if (!thread) {
    log.innerHTML = "";
    thread = el("div", "thread");
    log.appendChild(thread);
  }
  return thread;
}

function add(text, cls, calls, steps, total) {
  const row = el("div", "row " + cls);
  if (cls !== "user") {
    const av = el("div", "avatar" + (cls === "err" ? " err" : cls === "warn" ? " warn" : ""));
    av.innerHTML = cls === "bot" ? ICON.bot : cls === "err" ? ICON.err : ICON.info;
    row.appendChild(av);
  }
  const body = el("div", "body");
  const bubble = el("div", "bubble");
  if (cls === "bot") { bubble.classList.add("md"); bubble.innerHTML = markdown(text); }
  else bubble.textContent = text;
  body.appendChild(bubble);

  if (cls === "bot") {
    const meta = el("div", "meta");
    for (const t of calls || []) {
      const chip = el("span", "chip");
      chip.innerHTML = ICON.tool;
      chip.appendChild(document.createTextNode(toolLabels[t.name] || t.name));
      chip.title = t.name + (t.args && Object.keys(t.args).length ? "\n" + JSON.stringify(t.args, null, 1) : "");
      meta.appendChild(chip);
    }
    const copy = el("button", "icon-btn");
    copy.type = "button"; copy.innerHTML = ICON.copy + "<span>복사</span>";
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); copy.lastChild.textContent = "복사됨"; }
      catch (e) { copy.lastChild.textContent = "복사 실패"; }
      setTimeout(() => { copy.lastChild.textContent = "복사"; }, 1500);
    });
    meta.appendChild(copy);
    body.appendChild(meta);
  }
  if (steps && steps.length) body.appendChild(traceOf(steps, total));
  row.appendChild(body);
  ensureThread().appendChild(row);
  scrollDown();
  return row;
}

function traceOf(steps, total) {
  // 과정은 지우지 않고 접어 둔다. 결과만 남으면 "무엇을 보고 그렇게
  // 판단했는지" 를 되짚을 수 없다.
  const d = el("details", "trace");
  const sum = el("summary");
  sum.innerHTML = ICON.chev;
  sum.appendChild(document.createTextNode(`과정 보기 · ${steps.length}단계` + (total ? ` · ${total}초` : "")));
  d.appendChild(sum);
  const tl = el("div", "tl");
  for (const st of steps) {
    const line = el("div", "tstep");
    line.appendChild(el("b", null, st.t + "s"));
    line.appendChild(document.createTextNode(st.text));
    tl.appendChild(line);
  }
  d.appendChild(tl);
  return d;
}

function openChat(id) {
  currentId = id;
  const c = cur();
  thread = null;
  if (!c || !c.messages.length) { showWelcome(); renderChats(); $("q").focus(); return; }
  ensureThread();
  // 서버가 재시작됐으면 모델은 이 대화를 기억하지 못한다.
  if (serverBoot && c.boot && c.boot !== serverBoot) {
    const n = el("div", "note");
    n.innerHTML = ICON.info;
    n.appendChild(document.createTextNode("서버가 다시 시작되어 모델은 아래 내용을 기억하지 못합니다. "
      + "이어서 물으실 때는 필요한 내용을 다시 알려주세요."));
    thread.appendChild(n);
  }
  for (const m of c.messages) add(m.text, m.cls, m.calls, m.steps, m.total);
  renderChats();
  $("q").focus();
}

function newChat() {
  // 빈 대화가 이미 맨 위에 있으면 그것을 쓴다 — 버튼을 여러 번 눌러도 빈 대화가 쌓이지 않게.
  const blank = chats.find(c => !c.messages.length);
  if (blank) { openChat(blank.id); return; }
  currentId = "web-" + Math.random().toString(36).slice(2, 10);
  chats.unshift({id: currentId, title: "", updated: Date.now(), boot: serverBoot, messages: []});
  save(); openChat(currentId);
}

function remember(text, cls, calls, steps, total) {
  const c = cur();
  if (!c) return;
  c.messages.push({text, cls, calls: calls || null, steps: steps || null, total: total || 0});
  if (!c.title && cls === "user") c.title = text.slice(0, 30);
  c.updated = Date.now();
  c.boot = serverBoot;
  // 최근 대화를 위로 올린다.
  chats = [c, ...chats.filter(x => x.id !== c.id)];
  save(); renderChats();
}

$("newchat").addEventListener("click", () => { if (!busy) newChat(); document.body.classList.remove("nav"); });
$("menu").addEventListener("click", () => document.body.classList.toggle("nav"));
$("scrim").addEventListener("click", () => document.body.classList.remove("nav"));

// ── 입력창 ──────────────────────────────────────────────────────────────
const q = $("q");
const sendBtn = $("send");
const fit = () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 200) + "px"; };
const syncSend = () => { sendBtn.disabled = busy || !q.value.trim(); };
q.addEventListener("input", () => { fit(); syncSend(); });
q.addEventListener("keydown", (e) => {
  // 한글 조합 중 Enter 는 글자 확정이다 — 그때 보내면 마지막 글자가 두 번 들어간다.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("f").requestSubmit();
  }
});
function fillInput(text) {
  // 바로 보내지 않고 입력창에 넣는다. 날짜나 ID 를 고쳐서 보내는
  // 경우가 대부분이라 그 편이 쓸모 있다.
  q.value = text; fit(); syncSend(); q.focus();
  q.setSelectionRange(text.length, text.length);
}

// ── 예시 질문 · 연결 상태 ────────────────────────────────────────────────
function setStatus(kind, text) {
  const s = $("status");
  s.className = "status " + kind;
  s.lastElementChild.textContent = text;
  s.title = text;
}

fetch("/api/tools").then(r => r.json()).then(d => {
  serverBoot = (d.mcp && d.mcp.boot) || null;
  const inChat = (d.tools || []).filter(t => t.in_chat);
  for (const t of d.tools || []) if (t.label) toolLabels[t.name] = t.label;
  if (d.mcp && d.mcp.connected) {
    setStatus("ok", `연결됨 · 툴 ${inChat.length}개`);
    $("mcp").textContent = "MCP " + d.mcp.protocol + " · " + d.mcp.transport + " · 툴 " + inChat.length + "개";
  } else {
    setStatus("bad", "MCP 서버에 연결되지 않음");
  }
  // 챗봇에 노출된 툴의 예시만 띄운다 — 대화에 없는 툴의 예시를 클릭하면
  // 모델이 답할 수 없다.
  examples = inChat.filter(t => t.examples && t.examples.length)
                   .map(t => ({label: t.label || t.name, examples: t.examples}));
  const box = $("examples");
  box.innerHTML = "";
  if (!examples.length) { box.textContent = "(예시 없음)"; return; }
  for (const g of examples) {
    const group = el("div", "group");
    group.appendChild(el("h3", null, g.label));
    for (const text of g.examples) {
      const b = el("button", "ex", text);
      b.type = "button";
      b.addEventListener("click", () => fillInput(text));
      group.appendChild(b);
    }
    box.appendChild(group);
  }
}).catch(() => {
  setStatus("bad", "서버 응답 없음");
  $("examples").textContent = "(불러오지 못함)";
}).finally(() => {
  load();
  const recent = chats.find(c => c.messages && c.messages.length);
  if (recent) openChat(recent.id); else newChat();
});

// ── 전송 ────────────────────────────────────────────────────────────────
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || busy) return;
  busy = true;
  document.querySelector("main").classList.add("thinking");
  add(text, "user"); remember(text, "user");
  q.value = ""; fit(); syncSend();

  // 진행 중 상자: 지금 단계는 굵게, 지난 단계는 아래 목록으로, 경과 시간은 계속 센다.
  const row = el("div", "row bot");
  const av = el("div", "avatar"); av.innerHTML = ICON.bot; row.appendChild(av);
  const work = el("div", "work body");
  const head = el("div", "work-head");
  head.appendChild(el("span", "spin"));
  const now = el("span", null, "시작하는 중…");
  const elapsed = el("span", "el", "0s");
  head.appendChild(now); head.appendChild(elapsed);
  const prev = el("ul", "prev");
  work.appendChild(head); work.appendChild(prev);
  row.appendChild(work);
  ensureThread().appendChild(row);
  scrollDown();

  const t0 = Date.now();
  const tick = setInterval(() => { elapsed.textContent = Math.round((Date.now() - t0) / 1000) + "s"; }, 1000);
  const steps = [];                                // 접어 둘 과정 기록
  const step = (t) => {
    if (steps.length && steps[steps.length - 1].text === t) return;   // 같은 문구는 줄을 늘리지 않는다
    if (steps.length) {
      prev.appendChild(el("li", null, steps[steps.length - 1].text));
      while (prev.children.length > 4) prev.firstElementChild.remove();
    }
    steps.push({t: Math.round((Date.now() - t0) / 1000), text: t});
    now.textContent = t;
    scrollDown();
  };

  let finished = false;
  const finish = (cls, body, calls, pending) => {
    if (finished) return;
    finished = true;
    clearInterval(tick);
    const total = Math.round((Date.now() - t0) / 1000);
    row.remove();                                  // 진행 중 상자는 걷고
    add(body, cls, calls, steps, total);           // 접힌 과정으로 남긴다
    remember(body, cls, calls, steps, total);
    for (const p of (pending || [])) {
      const t = "확인 필요: " + (p.message || "서버가 사용자 확인을 요청했다");
      add(t, "warn"); remember(t, "warn");
    }
  };

  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, thread_id: currentId}),
    });
    if (!res.ok || !res.body) {
      const d = await res.json().catch(() => ({error: "응답을 읽지 못했다"}));
      finish("err", d.error || "요청 실패");
    } else {
      // SSE 를 직접 읽는다. EventSource 는 POST 를 못 보내서 fetch 로 받는다.
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        const parts = buf.split("\n\n");
        buf = parts.pop();                        // 잘린 마지막 조각은 남긴다
        for (const part of parts) {
          const line = part.split("\n").find(l => l.startsWith("data:"));
          if (!line) continue;
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === "done") finish("bot", ev.reply || "(빈 응답)", ev.tool_calls, ev.needs_confirmation);
          else if (ev.type === "error") finish("err", ev.text);
          else step(ev.text);
        }
      }
      // 끝 이벤트 없이 연결이 닫히면 진행 상자가 영원히 돈다 — 실패로 남긴다.
      finish("err", "서버 연결이 응답 도중 끊겼습니다. 서버 콘솔을 확인하세요.");
    }
  } catch (err) {
    finish("err", String(err));
  } finally {
    busy = false; syncSend(); q.focus(); scrollDown();
    document.querySelector("main").classList.remove("thinking");
  }
});
</script>
</body>
</html>
